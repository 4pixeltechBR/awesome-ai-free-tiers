name: "⚠️ Report Quota Change or Paywall / Relatar Mudança de Cota ou Paywall"
description: "Alert the maintainers if a provider has cut quotas, introduced a paywall, or deprecated a model."
title: "[Quota Alert]: <Provider Name> - <Issue Summary>"
labels: ["quota-alert", "audit-needed"]
body:
  - type: input
    id: provider_name
    attributes:
      label: "Provider / Model Affected"
      placeholder: "e.g., Groq - qwen/qwen3.6-27b"
    validations:
      required: true
  - type: dropdown
    id: issue_type
    attributes:
      label: "Type of Change"
      options:
        - "Free tier degraded (limits lowered)"
        - "Paywall introduced (now requires credit card or payment)"
        - "Model deprecated / sunset / 404"
        - "Broken link or console interface change"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Details & Evidence"
      description: "Paste error logs, HTTP responses, or documentation links showing the change."
      placeholder: "Describe what changed..."
    validations:
      required: true
